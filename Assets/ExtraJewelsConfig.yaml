# Synergy names double as localization keys: Jewelcrafting looks up
# jc_synergy_condition_<name with spaces replaced by underscores>. Valheim ends a $token at any of
# " (){}[]+-!?/\&%,.:-=<>" so these names must stay plain words and digits, or the lookup breaks.
equal moonstone and tanzanite above three:
  conditions:
    - moonstone > 3
    - tanzanite > 3
    - moonstone = tanzanite
  effect:
    Combat Spirit: 40
at least seven rhodolites:
  conditions:
    - rhodolite > 6
  effect:
    Intense Fire: 25
exactly six tigerseye and six peridot:
  conditions:
    - tigerseye = 6
    - peridot = 6
  effect:
    Weapon Master: 15
at least six turquoise:
  conditions:
    - turquoise > 5
  effect:
    Slippery When Wet: 35
at least thirteen turquoise:
  conditions:
    - turquoise > 12
  effect:
    Waterproof: 1
nine tanzanite six moonstone and three tigerseye:
  conditions:
    - tanzanite > 8
    - moonstone > 5
    - tigerseye > 2
  effect:
    Spellsword: 45